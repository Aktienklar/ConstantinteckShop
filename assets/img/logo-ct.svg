<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528.6 517.2">
  <!-- Die Bildmarke von Constantinteck: C und T, ineinandergesetzt. Uebernommen
       aus CT_Logo_richtigrum_gross.pdf. Dort liegt das Zeichen als Pixelbild,
       hier ist es in einen Umriss zurueckgerechnet - deshalb bleibt es in jeder
       Groesse scharf: im Kopf der Seite 36 Pixel hoch, auf der Seite
       "Ueber mich" gut zehnmal so gross.

       Beim Nachzeichnen ist ein Riss aus der Vorlage geschlossen worden: Dort
       liegt die rechte Kante des Viertelkreises als eigener, 2 Pixel breiter
       Strich neben der Flaeche. Im Pixelbild faellt das nicht auf, als Vektor
       waere daraus in jeder Groesse ein freistehender Haarstrich geworden.

       Die Fuellfarbe ist der Wert der Variablen cocoa aus
       assets/css/styles.css, damit das Zeichen zum Schriftzug daneben passt.
       Wer die Variable aendert, muss die Farbe hier mitaendern: Eine Datei,
       die als Bild eingebunden ist, erbt keine Farbe von der Seite. -->
