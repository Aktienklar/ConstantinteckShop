name: Deploy to GitHub Pages

# Läuft bei jedem Push auf main und bei manuellem Start über den Actions-Tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Der Workflow schreibt den Seiteninhalt in den Branch gh-pages.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nichts zu bauen: die HTML-Dateien im Repo sind bereits die Website.
      # Kopiert wird alles außer den Dateien, die nur die Entwicklung betreffen.
      - name: Website einsammeln
        run: |
          mkdir ../site
          rsync -a ./ ../site/ \
            --exclude .git \
            --exclude .github \
            --exclude .claude \
            --exclude .gitignore \
            --exclude deploy.sh \
            --exclude README.md
          # Ohne diese Datei ignoriert GitHub Pages Ordner, die mit _ beginnen.
          touch ../site/.nojekyll

      # Der Inhalt von ../site wird zum kompletten Inhalt des Branches gh-pages.
      # Jeder Deploy überschreibt ihn als einzelner Commit, damit sich im Repo
      # keine Historie aus Kopien ansammelt.
      - name: Nach gh-pages veröffentlichen
        working-directory: ../site
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy von ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
