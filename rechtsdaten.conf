# ==========================================================================
# RECHTSDATEN – die einzige Stelle, an der deine Pflichtangaben stehen
#
# Trag hier deine Daten ein und führe danach einmal aus:
#
#     ./rechtsdaten.sh
#
# Das Skript setzt die Werte in alle HTML-Dateien ein und entfernt die
# orangen Warnkästen von den vier Rechtsseiten. Danach ist die Datei nur
# noch Dokumentation – die Website läuft ohne sie.
#
# Alles hier steht anschließend öffentlich auf der Website. Das ist kein
# Versehen: Ein Impressum ist per Definition öffentlich. Trag deshalb nichts
# ein, was nicht öffentlich werden soll.
# ==========================================================================


# --- Pflicht nach § 5 DDG -------------------------------------------------

# Dein vollständiger bürgerlicher Name. Ein Fantasiename oder nur
# "Constantinteck" reicht nicht – es muss der Name sein, unter dem du
# verklagt werden könntest.
NAME="Constantin Teckentrup"

# Straße und Hausnummer. Ein Postfach genügt ausdrücklich NICHT: Es muss
# eine Anschrift sein, an der dir eine Klage zugestellt werden kann.
STRASSE="Dormagenerstrasse 23a"

# Postleitzahl und Ort, z. B. "10115 Berlin"
PLZ_ORT="41540 Dormagen"

# Eine E-Mail-Adresse, die du tatsächlich liest. Aktuell steht überall
# hello@constantinteck.example – die Endung .example ist reserviert und
# existiert nicht, jede Mail dorthin verschwindet spurlos. Das trifft auch
# Bestellrückfragen und Widerrufserklärungen.
#
# Naheliegend wäre hello@constantinteck.com – aber trag das nur ein, wenn
# das Postfach wirklich existiert und abgerufen wird. Eine Adresse, die
# echt aussieht und ins Leere läuft, ist schlimmer als eine sichtbar falsche.
EMAIL="info@constantinteck.com"

# § 5 DDG verlangt neben der E-Mail einen zweiten Weg zur "unmittelbaren
# Kommunikation". In der Praxis ist das die Telefonnummer. Zulässig wäre
# stattdessen ein Kontaktformular mit zugesagter Reaktionszeit – das hat
# diese Website nicht.
#
# Zusätzlich verlangt Art. 246a § 1 Abs. 1 Nr. 2 EGBGB seit Mai 2022 von
# jedem Shop, Verbrauchern vor dem Kauf Telefonnummer UND E-Mail zu nennen.
#
# Seit 29.10.2026 gibt es eine geschäftliche Nummer. Sie ist direkt in
# Impressum, Datenschutz, AGB und Widerrufsbelehrung eingetragen – das
# Skript ist schon gelaufen und findet keine Platzhalter mehr. Dieser Wert
# ist nur noch Dokumentation.
TELEFON="+49 2133 9366017"


# --- Rücksendungen --------------------------------------------------------

# Die vollständige Anschrift, an die Kunden Ware zurückschicken. Sie steht
# in der Widerrufsbelehrung und im Muster-Widerrufsformular.
#
# Ist sie identisch mit deiner Anschrift oben, lass das Feld leer – das
# Skript setzt dann Name, Straße und Ort ein. Stand 29.10.2026: identisch
# (Rücksendungen gehen ebenfalls nach Dormagen).
RUECKSENDEADRESSE=""


# --- Datenschutzerklärung -------------------------------------------------

# Wer die Pakete transportiert, z. B. "DHL (Deutsche Post DHL Group,
# Charles-de-Gaulle-Str. 20, 53113 Bonn)". Der Dienstleister bekommt Name
# und Lieferanschrift deiner Kunden, also muss er benannt werden.
VERSANDDIENSTLEISTER="DHL (Deutsche Post DHL Group, Charles-de-Gaulle-Str. 20, 53113 Bonn)"

# Die Datenschutz-Aufsichtsbehörde deines Bundeslandes – dorthin können
# sich Besucher beschweren, und du musst sagen, welche das ist. Maßgeblich
# ist dein Wohnsitz bzw. Betriebssitz, nicht der deiner Kunden.
# Beispiel Berlin: "Berliner Beauftragte für Datenschutz und
# Informationsfreiheit, Alt-Moabit 59-61, 10555 Berlin"
# Liste aller Behörden: https://www.bfdi.bund.de/DE/Service/Anschriften/
AUFSICHTSBEHOERDE="Landesbeauftragte für Datenschutz und Informationsfreiheit Nordrhein-Westfalen, Kavalleriestr. 2-4, 40213 Düsseldorf"
